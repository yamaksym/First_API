<!DOCTYPE html>
<html lang="uk">
<head>
    <style>
        body {
           font-family: Ink Free;
           background: linear-gradient(69deg, #fc0303, #f0fc03, #0303fc);
           margin: 0;
           padding: 20px;
           color: #323;
       }
       .container {
           max-width: 600px;
           margin: 0 auto;
           background: pink;
           border-radius: 20px;
           padding: 30px;
           box-shadow: 0 10px 30px rgba(0,0,0,4);
       }
       h1 { text-align: center; color: #ff6b6b; font-size: 2.5em; }
       .section {
           background: #f7faf1;
           border-radius: 15px;
           padding: 20px;
           margin: 20px 0;
           border: 3px solid #ff6b6b;
       }
       input, button {
           padding: 12px;
           border: 2px solid #ff6b6b;
           border-radius: 10px;
           font-size: 16px;
           margin: 5px;
       }
       input { width: 200px; }
       button {
           background: #ff6b6b;
           color: white;
           cursor: pointer;
           border: none;
           font-weight: bold;
       }
       button:hover { background: #525252; }
       .result {
           background: #e8f5e8;
           border: 2px solid #4caf50;
           border-radius: 10px;
           padding: 15px;
           margin: 10px 0;
           font-size: 1.2em;
       }
    </style>
   <meta charset="UTF-8">
   <title>💀 API</title>
    <link ref="stylesheet" href="../Static/CSS/style.css">
</head>
<body>
   <div class="container">
       <h1>Just API</h1>


       <div class="section">
           <h3>🎲 Random</h3>
           <button onclick="getRandomAnimal()">Random animal</button>
           <button onclick="getRandomColor()">Random colour</button>
           <button onclick="getJoke()">Funny joke</button>
           <div id="random-result" class="result" style="display:none;"></div>
       </div>


       <div class="section">
           <h3>🧮 Calculator (addition)</h3>
           <input type="number" id="num1" placeholder="1st number">
           <input type="number" id="num2" placeholder="2nd number">
           <button onclick="calculate_add()">Calculate</button>
           <div id="calc-result" class="result" style="display:none;"></div>
       </div>
       <div class="section">
           <h3>🧮 Calculator (subtraction)</h3>
           <input type="number" id="num3" placeholder="1st number">
           <input type="number" id="num4" placeholder="2nd number">
           <button onclick="calculate_subtract()">Calculate</button>
           <div id="calc-result2" class="result" style="display:none;"></div>
       </div>
       <div class="section">
           <h3>🧮 Calculator (multiplication)</h3>
           <input type="number" id="num5" placeholder="1st number">
           <input type="number" id="num6" placeholder="2nd number">
           <button onclick="calculate_multiply()">Calculate</button>
           <div id="calc-result3" class="result" style="display:none;"></div>
       </div>
       <div class="section">
           <h3>🧮 Calculator (division)</h3>
           <input type="number" id="num7" placeholder="1st number">
           <input type="number" id="num8" placeholder="2nd number">
           <button onclick="calculate_divide()">Calculate</button>
           <div id="calc-result4" class="result" style="display:none;"></div>
       </div>


       <div class="section">
           <h3>👋 Greet</h3>
           <input type="text" id="name" placeholder="Your name">
           <input type="number" id="age" placeholder="Your age">
           <button onclick="getGreeting()">Greet</button>
           <div id="greeting-result" class="result" style="display:none;"></div>
       </div>


       <div class="section">
           <h3>🔤 Character counter</h3>
           <input type="text" id="word" placeholder="Write a word/sentence">
           <button onclick="countLetters()">Count all characters</button>
           <div id="letters-result" class="result" style="display:none;"></div>
       </div>
   </div>

   <script src="../Static/JS/script.js"></script>
</body>
</html>
